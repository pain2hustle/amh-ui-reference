<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMH FieldScan AI Login</title>
    <meta name="description" content="Login for AMH Site Revival project accounts." />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body class="panel-page">
    <main class="auth-shell">
      <section class="auth-card">
        <a class="brand auth-brand" href="./index.html">
          <span class="brand-mark">AMH</span>
          <span>AMH Site Revival</span>
        </a>
        <p class="eyebrow">Private Access</p>
        <h1>AMH FieldScan AI login.</h1>
        <p>
          Sign in to review worker confirmations, approve FieldScan scan packets, add manager notes, and keep the build lane organized.
        </p>
        <form id="loginForm" class="auth-form">
          <label>
            <span>Email</span>
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <div data-turnstile-slot></div>
          <button class="button primary" type="submit">Log in</button>
          <div id="loginMsg" class="form-msg" role="status"></div>
        </form>
        <a class="small-link" href="./forgot-password.html">Recover account access</a>
      </section>
    </main>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script src="./effects.js"></script>
    <script src="./login.js"></script>
    <script src="./nav.js"></script>
