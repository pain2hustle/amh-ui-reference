<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Roadscape logo mark">
  <rect width="100" height="100" rx="22.5" fill="#16150F"/>
  <!-- road runs ALL THE WAY THROUGH: top edge to bottom edge, no dead space -->
  <path d="M33 102 C33 78 67 70 67 50 C67 30 33 22 33 -2" fill="none" stroke="#F4F0E3" stroke-width="15" stroke-linecap="butt"/>
  <!-- dashed centerline = lane markings, reads unmistakably as a road -->
  <path d="M33 102 C33 78 67 70 67 50 C67 30 33 22 33 -2" fill="none" stroke="#16150F" stroke-width="2.6" stroke-dasharray="4 8" stroke-linecap="round"/>
  <!-- the green O: a clear road node/roundabout, bigger + bolder so it never gets lost -->
  <circle cx="42" cy="16" r="10" fill="#16150F" stroke="#41994E" stroke-width="6"/>
  <circle cx="42" cy="16" r="3.4" fill="#41994E"/>
</svg>
